<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Investment OS</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080a0f;
            --surface: rgba(20, 24, 35, .84);
            --border: rgba(255, 255, 255, .09);
            --text: #f7f8fb;
            --muted: #98a2b5;
            --accent: #8b5cf6;
            --cyan: #22d3ee;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(circle at 75% 10%, rgba(139,92,246,.22), transparent 28rem),
                radial-gradient(circle at 20% 90%, rgba(34,211,238,.10), transparent 30rem),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .auth-shell {
            width: min(440px, 100%);
            opacity: 0;
            transform: translateY(18px) scale(.985);
            animation: enter 650ms cubic-bezier(.22,1,.36,1) forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            box-shadow: 0 18px 45px rgba(139,92,246,.28);
            font-size: 20px;
            font-weight: 900;
        }

        .brand-name { font-weight: 850; letter-spacing: -.025em; }
        .brand-copy { color: var(--muted); font-size: 11px; margin-top: 2px; }

        .card {
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 36px 110px rgba(0,0,0,.42);
            backdrop-filter: blur(22px);
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -.045em;
        }

        .subtitle {
            margin: 9px 0 24px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        form { display: grid; gap: 16px; }
        .field { display: grid; gap: 8px; }

        label {
            color: #b7c0d0;
            font-size: 12px;
            font-weight: 750;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 14px;
            color: var(--text);
            background: rgba(7,10,16,.72);
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: none;
            transition: border-color 170ms, box-shadow 170ms, transform 170ms;
        }

        input:focus {
            transform: translateY(-1px);
            border-color: rgba(139,92,246,.62);
            box-shadow: 0 0 0 4px rgba(139,92,246,.12);
        }

        .help {
            color: #69748a;
            font-size: 10px;
            line-height: 1.45;
        }

        button {
            min-height: 48px;
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 13px;
            color: white;
            background: linear-gradient(135deg, var(--accent), #6d5dfc);
            box-shadow: 0 16px 36px rgba(139,92,246,.22);
            font-weight: 820;
            cursor: pointer;
            transition: transform 170ms, box-shadow 170ms;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 44px rgba(139,92,246,.32);
        }

        .switch {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .switch a {
            color: var(--cyan);
            font-weight: 750;
            text-decoration: none;
        }

        .alert {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(251,113,133,.24);
            border-radius: 12px;
            color: #fecdd3;
            background: rgba(251,113,133,.10);
            font-size: 12px;
            line-height: 1.45;
        }

        .alert.show { display: block; animation: alert-in 300ms ease-out; }

        @keyframes enter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes alert-in {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                transition-duration: 1ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="auth-shell">
        <div class="brand">
            <div class="brand-mark">I</div>
            <div>
                <div class="brand-name">Investment OS</div>
                <div class="brand-copy">PERSONAL FINANCE</div>
            </div>
        </div>

        <section class="card">
            <h1>Crie sua conta.</h1>

            <p class="subtitle">
                Configure seu acesso para começar a organizar sua carteira.
            </p>

            <div id="alert" class="alert" role="status"></div>

            <form method="post" action="/register">
                <div class="field">
                    <label for="username">Usuário</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        minlength="3"
                        maxlength="40"
                        autocomplete="username"
                        required
                    >
                    <span class="help">Entre 3 e 40 caracteres.</span>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                    <span class="help">Use pelo menos 8 caracteres.</span>
                </div>

                <div class="field">
                    <label for="password_confirmation">Confirmar senha</label>
                    <input
                        id="password_confirmation"
                        name="password_confirmation"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit">Criar conta</button>
            </form>

            <p class="switch">
                Já possui uma conta?
                <a href="/login">Entrar</a>
            </p>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");
        const alert = document.querySelector("#alert");

        const messages = {
            "invalid-username": "O usuário deve possuir entre 3 e 40 caracteres.",
            "invalid-password": "A senha deve possuir entre 8 e 128 caracteres.",
            "password-mismatch": "A confirmação não corresponde à senha.",
            "username-taken": "Este nome de usuário já está em uso."
        };

        if (messages[status]) {
            alert.textContent = messages[status];
            alert.classList.add("show");
            window.history.replaceState({}, "", "/register");
        }
    </script>
</body>
</html>
